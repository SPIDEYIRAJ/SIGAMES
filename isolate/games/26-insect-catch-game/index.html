  <style>
@import url("https://fonts.googleapis.com/css?family=Press+Start+2P&display=swap");

* {
  box-sizing: border-box;
}

body {
  background-color: #516dff;
  color: #fff;
  font-family: "Press Start 2P", sans-serif;
  height: 100vh;
  overflow: hidden;
  margin: 0;
  text-align: center;
}

a {
  color: #fff;
}

h1 {
  line-height: 1.4;
}

.btn {
  border: 0;
  background-color: #fff;
  color: #516dff;
  padding: 15px 20px;
  font-family: inherit;
  cursor: pointer;
}

.btn:hover {
  opacity: 0.9;
}

.btn:focus {
  outline: none;
}

.screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  width: 100vw;
  transition: margin 0.5s ease-out;
}

.screen.up {
  margin-top: -100vh;
}

.insects-list {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  list-style-type: none;
  padding: 0;
}

.insects-list li {
  margin: 10px;
}

.choose-insect-btn {
  background-color: transparent;
  border: 2px solid #fff;
  color: #fff;
  cursor: pointer;
  font-family: inherit;
  width: 150px;
  height: 150px;
}

.choose-insect-btn:hover {
  background-color: #fff;
  color: #516dff;
}

.choose-insect-btn:active {
  background-color: rgba(255, 255, 255, 0.7);
}

.choose-insect-btn img {
  width: 100px;
  height: 100px;
  object-fit: contain;
}

.choose-insect-btn .critter {
  width: 100px;
  height: 100px;
  filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35));
}

.game-container {
  position: relative;
}

.time,
.score {
  position: absolute;
  top: 20px;
}

.time {
  left: 20px;
}

.score {
  right: 20px;
}

.message {
  line-height: 1.7;
  background-color: rgba(0, 0, 0, 0.5);
  width: 100%;
  padding: 20px;
  z-index: 100;
  text-align: center;
  opacity: 0;
  position: absolute;
  top: 0;
  left: 50%;
  transform: translate(-50%, -150%);
}

.message.visible {
  transform: translate(-50%, 150%);
  opacity: 1;
}

.insect {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100px;
  height: 100px;
  position: absolute;
  transform: translate(-50%, -50%) scale(1);
  transition: transform 0.3s ease-in-out;
  cursor: pointer;
}

.insect img,
.insect svg {
  width: 100px;
  height: 100px;
  filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35));
}

.insect.caught {
  transform: translate(-50%, -50%) scale(0);
}
  </style>
  </head>
  <body>
    <div class="screen">
      <h1>Catch The Insect</h1>
      <button class="btn" id="start-btn">Play Game</button>
    </div>
    <div class="screen">
      <h1>What is your "favorite" insect?</h1>
      <ul class="insects-list">
        <li>
          <button class="choose-insect-btn" data-name="Fly">
            <p>Fly</p>
            <svg class="critter" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <ellipse cx="33" cy="40" rx="24" ry="15" fill="#dbeafe" opacity=".8" transform="rotate(-22 33 40)" />
              <ellipse cx="67" cy="40" rx="24" ry="15" fill="#dbeafe" opacity=".8" transform="rotate(22 67 40)" />
              <ellipse cx="50" cy="62" rx="16" ry="26" fill="#1f2937" />
              <path d="M36 84 L30 96 M50 88 L50 98 M64 84 L70 96" stroke="#111827" stroke-width="4" stroke-linecap="round" fill="none" />
              <circle cx="50" cy="34" r="14" fill="#334155" />
              <circle cx="44" cy="31" r="5" fill="#f8fafc" />
              <circle cx="56" cy="31" r="5" fill="#f8fafc" />
              <circle cx="44" cy="31" r="2.4" fill="#0f172a" />
              <circle cx="56" cy="31" r="2.4" fill="#0f172a" />
            </svg>
          </button>
        </li>
        <li>
          <button class="choose-insect-btn" data-name="Mosquito">
            <p>Mosquito</p>
            <svg class="critter" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <ellipse cx="38" cy="38" rx="22" ry="10" fill="#e0f2fe" opacity=".75" transform="rotate(-18 38 38)" />
              <ellipse cx="62" cy="38" rx="22" ry="10" fill="#e0f2fe" opacity=".75" transform="rotate(18 62 38)" />
              <path d="M50 40 L50 88" stroke="#1f2937" stroke-width="7" stroke-linecap="round" />
              <path d="M44 48 L22 34 M44 58 L16 56 M44 68 L20 80 M56 48 L78 34 M56 58 L84 56 M56 68 L80 80" stroke="#111827" stroke-width="3.4" stroke-linecap="round" fill="none" />
              <circle cx="50" cy="32" r="11" fill="#0f172a" />
              <path d="M45 30 L20 18 M55 30 L80 18" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round" fill="none" />
              <path d="M50 86 L50 98" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
            </svg>
          </button>
        </li>
        <li>
          <button class="choose-insect-btn" data-name="Spider">
            <p>Spider</p>
            <svg class="critter" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M42 40 L16 22 M40 50 L10 46 M40 60 L16 78 M58 40 L84 22 M60 50 L90 46 M60 60 L84 78" stroke="#1f2937" stroke-width="5" stroke-linecap="round" fill="none" />
              <ellipse cx="50" cy="60" rx="21" ry="23" fill="#1f2937" />
              <circle cx="50" cy="32" r="15" fill="#334155" />
              <circle cx="44" cy="30" r="4.4" fill="#ef4444" />
              <circle cx="56" cy="30" r="4.4" fill="#ef4444" />
              <circle cx="44" cy="30" r="1.8" fill="#fee2e2" />
              <circle cx="56" cy="30" r="1.8" fill="#fee2e2" />
              <path d="M40 50 L50 46 L60 50 L50 56 Z" fill="#ef4444" opacity=".85" />
            </svg>
          </button>
        </li>
        <li>
          <button class="choose-insect-btn" data-name="Roach">
            <p>Roach</p>
            <svg class="critter" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M40 42 L14 26 M36 54 L8 52 M38 66 L16 84 M60 42 L86 26 M64 54 L92 52 M62 66 L84 84" stroke="#3f2d1c" stroke-width="4.6" stroke-linecap="round" fill="none" />
              <ellipse cx="50" cy="58" rx="24" ry="30" fill="#5b3a24" />
              <path d="M50 30 L50 88" stroke="#3b2415" stroke-width="3" />
              <path d="M42 40 Q50 34 58 40 M42 52 Q50 46 58 52 M42 64 Q50 58 58 64" stroke="#8a5a36" stroke-width="2.4" fill="none" />
              <ellipse cx="50" cy="24" rx="14" ry="12" fill="#3b2415" />
              <path d="M42 20 L22 6 M58 20 L78 6" stroke="#3b2415" stroke-width="2.8" stroke-linecap="round" fill="none" />
            </svg>
          </button>
        </li>
      </ul>
    </div>
    <div class="screen game-container" id="game-container">
      <h3 id="time" class="time">Time: 00:00</h3>
      <h3 id="score" class="score">Score: 0</h3>
      <h5 id="message" class="message">
        Are you annnoyed yet? <br />
        You are playing an impossible game!!
      </h5>
    </div>
    
  
  <script>
const screens = document.querySelectorAll(".screen");
const chooseInsectButtons = document.querySelectorAll(".choose-insect-btn");
const startButton = document.getElementById("start-btn");
const gameContainer = document.getElementById("game-container");
const timeElement = document.getElementById("time");
const scoreElement = document.getElementById("score");
const message = document.getElementById("message");
let seconds = 0;
let score = 0;
let selectedInsect = { name: "Insect", markup: "" };

startButton.addEventListener("click", () => screens[0].classList.add("up"));

const increaseScore = () => {
  score++;
  if (score > 19) message.classList.add("visible");
  scoreElement.innerHTML = `Score: ${score}`;
};

const addInsects = () => {
  setTimeout(createInsect, 1000);
  setTimeout(createInsect, 1500);
};

const catchInsect = function () {
  increaseScore();
  this.classList.add("caught");
  setTimeout(() => this.remove, 2000);
  addInsects();
};

const getRandomLocation = () => {
  const width = window.innerWidth;
  const height = window.innerHeight;
  const x = Math.random() * (width - 200) + 100;
  const y = Math.random() * (height - 200) + 100;
  return { x, y };
};

const createInsect = () => {
  const insect = document.createElement("div");
  insect.classList.add("insect");
  const { x, y } = getRandomLocation();
  insect.style.top = `${y}px`;
  insect.style.left = `${x}px`;
  insect.setAttribute("role", "img");
  insect.setAttribute("aria-label", selectedInsect.name);
  insect.innerHTML = `<span style="display:block;transform:rotate(${Math.round(Math.random() * 360)}deg)">${selectedInsect.markup}</span>`;
  insect.addEventListener("click", catchInsect);
  gameContainer.appendChild(insect);
};

const increaseTime = () => {
  let m = Math.floor(seconds / 60);
  let s = seconds % 60;
  m = m < 10 ? `0${m}` : m;
  s = s < 10 ? `0${s}` : s;
  timeElement.innerHTML = `Time: ${m}:${s}`;
  seconds++;
};

const startGame = () => setInterval(increaseTime, 1000);

chooseInsectButtons.forEach((button) => {
  button.addEventListener("click", () => {
    const art = button.querySelector("svg");
    selectedInsect = { name: button.dataset.name || "Insect", markup: art ? art.outerHTML : "" };
    screens[1].classList.add("up");
    setTimeout(createInsect, 1000);
    startGame();
  });
});
  </script>
  </body>
