<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" role="img" aria-label="Endurance Race — a car drifting through rain on a wet night circuit">
  <defs>
    <linearGradient id="er-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040711"/>
      <stop offset=".55" stop-color="#091a2a"/>
      <stop offset="1" stop-color="#103042"/>
    </linearGradient>
    <radialGradient id="er-city" cx="50%" cy="100%" r="70%">
      <stop offset="0" stop-color="#4fe3ff" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#1b6f96" stop-opacity=".12"/>
      <stop offset="1" stop-color="#0a1c2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="er-road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1520"/>
      <stop offset=".45" stop-color="#101d2b"/>
      <stop offset="1" stop-color="#060b13"/>
    </linearGradient>
    <linearGradient id="er-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset=".42" stop-color="#cfdae8"/>
      <stop offset=".72" stop-color="#8fa0b6"/>
      <stop offset="1" stop-color="#4d5a6c"/>
    </linearGradient>
    <linearGradient id="er-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16293c"/>
      <stop offset=".55" stop-color="#0b1725"/>
      <stop offset="1" stop-color="#050b13"/>
    </linearGradient>
    <linearGradient id="er-spray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dff6ff" stop-opacity="0"/>
      <stop offset=".6" stop-color="#dff6ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="er-streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fd8ff" stop-opacity="0"/>
      <stop offset=".75" stop-color="#cfeaff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="er-tail" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff4266" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff2044" stop-opacity="0"/>
    </radialGradient>
    <filter id="er-blur-s" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="er-blur-m" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="er-blur-l" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- Night sky and horizon haze -->
  <rect width="700" height="500" fill="url(#er-sky)"/>
  <ellipse cx="350" cy="252" rx="430" ry="120" fill="url(#er-city)"/>

  <!-- Distant warehouses and light towers -->
  <g fill="#080f19" opacity=".92">
    <path d="M0 246 L0 214 L58 214 L58 226 L96 226 L96 208 L150 208 L150 246 Z"/>
    <path d="M520 246 L520 212 L568 212 L568 224 L614 224 L614 204 L700 204 L700 246 Z"/>
  </g>
  <g fill="#7fe6ff" opacity=".5">
    <rect x="24" y="222" width="6" height="4"/>
    <rect x="40" y="228" width="6" height="4"/>
    <rect x="112" y="216" width="7" height="4"/>
    <rect x="128" y="222" width="7" height="4"/>
    <rect x="546" y="220" width="6" height="4"/>
    <rect x="646" y="212" width="7" height="4"/>
    <rect x="664" y="218" width="7" height="4"/>
  </g>
  <g stroke="#ffcf7a" stroke-width="2" opacity=".35">
    <path d="M198 246 L198 176"/>
    <path d="M486 246 L486 182"/>
  </g>
  <g fill="#ffe2a8" opacity=".8">
    <circle cx="198" cy="174" r="3"/>
    <circle cx="486" cy="180" r="3"/>
  </g>

  <!-- Wet circuit receding to the horizon -->
  <path d="M0 500 L0 300 L258 246 L442 246 L700 300 L700 500 Z" fill="url(#er-road)"/>
  <g stroke="#9fd8ff" stroke-opacity=".2" stroke-width="2">
    <path d="M236 252 L120 500"/>
    <path d="M464 252 L580 500"/>
  </g>
  <g stroke="#e8f7ff" stroke-opacity=".26" stroke-width="3" stroke-dasharray="26 46">
    <path d="M350 252 L350 500" stroke-width="1.4"/>
    <path d="M392 500 L356 258" stroke-opacity=".16"/>
  </g>

  <!-- Standing water picking up neon -->
  <g filter="url(#er-blur-m)" opacity=".55">
    <ellipse cx="140" cy="420" rx="120" ry="18" fill="#0f9bbd" opacity=".3"/>
    <ellipse cx="566" cy="392" rx="130" ry="16" fill="#0f9bbd" opacity=".26"/>
    <ellipse cx="350" cy="470" rx="220" ry="22" fill="#0a7ea0" opacity=".2"/>
  </g>

  <!-- Rain curtains -->
  <g stroke="#cfeeff" stroke-linecap="round">
    <g stroke-opacity=".18" stroke-width="1.2">
      <path d="M44 20 L22 96"/><path d="M92 8 L70 82"/><path d="M140 32 L118 110"/>
      <path d="M188 12 L166 84"/><path d="M236 44 L214 124"/><path d="M284 18 L262 92"/>
      <path d="M332 54 L310 132"/><path d="M380 22 L358 96"/><path d="M428 60 L406 138"/>
      <path d="M476 28 L454 100"/><path d="M524 66 L502 142"/><path d="M572 30 L550 104"/>
      <path d="M620 70 L598 148"/><path d="M668 36 L646 108"/><path d="M70 180 L48 252"/>
      <path d="M150 168 L128 240"/><path d="M230 190 L208 262"/><path d="M310 172 L288 244"/>
      <path d="M390 196 L368 268"/><path d="M470 174 L448 246"/><path d="M550 198 L528 270"/>
      <path d="M630 178 L608 250"/><path d="M24 300 L8 356"/><path d="M118 316 L102 372"/>
      <path d="M212 332 L196 388"/><path d="M306 316 L290 372"/><path d="M400 340 L384 396"/>
      <path d="M494 320 L478 376"/><path d="M588 344 L572 400"/><path d="M682 326 L666 382"/>
    </g>
    <g stroke-opacity=".34" stroke-width="1.6">
      <path d="M62 108 L34 202"/><path d="M204 88 L176 182"/><path d="M346 122 L318 216"/>
      <path d="M488 96 L460 190"/><path d="M630 128 L602 222"/><path d="M112 260 L84 354"/>
      <path d="M254 300 L226 394"/><path d="M396 268 L368 362"/><path d="M538 304 L510 398"/>
      <path d="M658 272 L630 366"/>
    </g>
  </g>

  <!-- Spirit of the drift: long wet streaks dragging left -->
  <g fill="url(#er-streak)" opacity=".7">
    <rect x="10" y="336" width="230" height="2.4" rx="1.2"/>
    <rect x="40" y="352" width="196" height="3" rx="1.5"/>
    <rect x="4" y="370" width="246" height="2" rx="1"/>
    <rect x="58" y="388" width="180" height="2.6" rx="1.3"/>
    <rect x="22" y="404" width="214" height="1.8" rx=".9"/>
  </g>

  <!-- Water spray kicked up behind the car -->
  <g filter="url(#er-blur-m)">
    <ellipse cx="196" cy="404" rx="150" ry="30" fill="url(#er-spray)"/>
    <ellipse cx="150" cy="386" rx="96" ry="20" fill="#cdefff" opacity=".16"/>
    <ellipse cx="520" cy="410" rx="120" ry="24" fill="url(#er-spray)"/>
  </g>
  <g fill="#e8f8ff" opacity=".3">
    <circle cx="168" cy="378" r="3"/>
    <circle cx="138" cy="396" r="2.2"/>
    <circle cx="112" cy="382" r="1.8"/>
    <circle cx="86" cy="402" r="2.4"/>
    <circle cx="58" cy="388" r="1.6"/>
    <circle cx="214" cy="416" r="2"/>
    <circle cx="548" cy="392" r="2"/>
    <circle cx="586" cy="406" r="1.7"/>
  </g>

  <!-- Contact shadow -->
  <ellipse cx="368" cy="404" rx="186" ry="30" fill="#000" opacity=".6" filter="url(#er-blur-s)"/>

  <!-- Taillight bloom behind the car -->
  <g filter="url(#er-blur-l)">
    <ellipse cx="268" cy="352" rx="54" ry="24" fill="url(#er-tail)"/>
    <ellipse cx="466" cy="350" rx="54" ry="24" fill="url(#er-tail)"/>
  </g>
  <g filter="url(#er-blur-m)" opacity=".55">
    <rect x="246" y="392" width="34" height="74" rx="16" fill="#ff2b52"/>
    <rect x="456" y="390" width="34" height="70" rx="16" fill="#ff2b52"/>
    <rect x="326" y="398" width="84" height="52" rx="10" fill="#0fa6c9" opacity=".5"/>
  </g>

  <!-- The car, angled as the rear steps out -->
  <g transform="rotate(-6 368 356)">
    <!-- rear wheels -->
    <rect x="242" y="364" width="46" height="34" rx="12" fill="#070b11"/>
    <rect x="448" y="364" width="46" height="34" rx="12" fill="#070b11"/>
    <rect x="248" y="370" width="34" height="8" rx="4" fill="#4e5c70" opacity=".5"/>
    <rect x="454" y="370" width="34" height="8" rx="4" fill="#4e5c70" opacity=".5"/>

    <!-- diffuser and bumper -->
    <path d="M252 382 L492 382 L482 396 Q368 406 260 396 Z" fill="#111a24"/>
    <g stroke="#2b3a4b" stroke-width="2">
      <path d="M290 386 L290 398"/>
      <path d="M322 388 L322 400"/>
      <path d="M354 388 L354 401"/>
      <path d="M386 388 L386 401"/>
      <path d="M418 388 L418 400"/>
      <path d="M450 386 L450 398"/>
    </g>

    <!-- main body -->
    <path d="M244 348 Q248 318 288 306 L448 306 Q488 318 492 348 L496 372 Q496 386 480 388 L256 388 Q240 386 240 372 Z" fill="url(#er-body)"/>
    <!-- shoulder highlight -->
    <path d="M252 322 Q368 300 484 322" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2.4"/>
    <!-- side shading -->
    <path d="M240 356 Q368 342 496 356 L496 372 Q496 386 480 388 L256 388 Q240 386 240 372 Z" fill="#0b131d" opacity=".35"/>

    <!-- rear glass -->
    <path d="M300 328 L314 296 Q368 284 422 296 L436 328 Q368 314 300 328 Z" fill="url(#er-glass)"/>
    <path d="M312 326 Q368 312 424 326" fill="none" stroke="#9fd8ff" stroke-opacity=".3" stroke-width="2"/>

    <!-- roof + spoiler -->
    <path d="M306 296 Q368 282 430 296 L426 306 Q368 292 310 306 Z" fill="#101b27"/>
    <rect x="284" y="300" width="168" height="9" rx="3" fill="#0f1924"/>
    <rect x="284" y="300" width="168" height="2.4" rx="1.2" fill="#8ea3ba" opacity=".55"/>

    <!-- full-width light bar -->
    <rect x="258" y="338" width="220" height="9" rx="4.5" fill="#7c0d22"/>
    <rect x="260" y="338" width="216" height="5" rx="2.5" fill="#ff3159"/>
    <rect x="330" y="339" width="76" height="3" rx="1.5" fill="#ffd0da" opacity=".85"/>

    <!-- tail lamp clusters -->
    <rect x="252" y="330" width="52" height="16" rx="5" fill="#1a0d14"/>
    <rect x="254" y="332" width="48" height="11" rx="4" fill="#ff2b52"/>
    <rect x="432" y="330" width="52" height="16" rx="5" fill="#1a0d14"/>
    <rect x="434" y="332" width="48" height="11" rx="4" fill="#ff2b52"/>

    <!-- plate -->
    <rect x="336" y="356" width="64" height="18" rx="3" fill="#0a1119"/>
    <rect x="338" y="358" width="60" height="14" rx="2" fill="#dfe8f2" opacity=".9"/>
    <g fill="#233246">
      <rect x="344" y="363" width="4" height="6"/>
      <rect x="352" y="363" width="4" height="6"/>
      <rect x="360" y="363" width="4" height="6"/>
      <rect x="370" y="363" width="4" height="6"/>
      <rect x="378" y="363" width="4" height="6"/>
      <rect x="388" y="363" width="4" height="6"/>
    </g>

    <!-- rain beading on the paint -->
    <g fill="#eaf8ff" opacity=".45">
      <circle cx="276" cy="318" r="1.7"/>
      <circle cx="302" cy="344" r="1.4"/>
      <circle cx="334" cy="316" r="1.2"/>
      <circle cx="404" cy="318" r="1.6"/>
      <circle cx="442" cy="346" r="1.3"/>
      <circle cx="470" cy="330" r="1.5"/>
    </g>
  </g>

  <!-- Foreground rain caught in the light -->
  <g stroke="#ffffff" stroke-linecap="round" stroke-opacity=".16" stroke-width="2">
    <path d="M96 440 L58 500"/>
    <path d="M190 424 L152 500"/>
    <path d="M286 448 L248 500"/>
    <path d="M474 436 L436 500"/>
    <path d="M570 452 L532 500"/>
    <path d="M652 428 L614 500"/>
  </g>

  <!-- Corner marks and slate -->
  <g fill="#9fe9ff" opacity=".45">
    <rect x="26" y="26" width="34" height="2"/>
    <rect x="26" y="26" width="2" height="18"/>
    <rect x="640" y="472" width="34" height="2"/>
    <rect x="672" y="456" width="2" height="18"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#cfeaff">
    <text x="34" y="60" font-size="13" letter-spacing="6" opacity=".85">ENDURANCE</text>
    <text x="34" y="78" font-size="9" letter-spacing="3.4" opacity=".55">NIGHT RUN // RAIN</text>
    <text x="666" y="66" font-size="9" letter-spacing="2.4" opacity=".4" text-anchor="end">WEBGPU</text>
  </g>
</svg>
